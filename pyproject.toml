[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agenvantage"
version = "0.1.0"
description = "Local agent context planning, prompt optimization, and token observability."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pytest>=8.0.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]
graphify = ["graphifyy==0.9.13"]

[project.scripts]
agenvantage = "agenvantage.cli:main"
agenvantage-mcp = "agenvantage.mcp_server:run_stdio_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenvantage = ["resources/**/*.md"]

[tool.setuptools.data-files]
"share/agenvantage/examples" = ["examples/synthetic_oncall_context.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
